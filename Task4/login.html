<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        h2 { color: #38bdf8; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #7dd3fc; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Member Login</h2>
        <input type="text" id="username" placeholder="Enter name">
        <button id="loginBtn">Login</button>
    </div>
</body>
<script>
    async function SendData(name) {
        try{
            const Response = await fetch('http://localhost:3000/sendData',{
                method : 'POST',
                headers: {
                    'Content-Type': 'application/json' 
                },
                body : JSON.stringify(name),
            });
            if(!Response.ok) throw new Error(`Error: ${Response.status}`);
            const Data =  await Response.json();
            
            console.log(Data);

            window.location.href = 'Dashboard.html';        
        }catch{
            console.log('Somthing Went Wrong at login page');
        }
    }

    const username = document.getElementById('username');
    const Btn = document.getElementById('loginBtn');

    Btn.addEventListener('click',(e)=>{
        e.preventDefault();
        e.stopPropagation();

        let inputUser = username.value.trim();

        const Member ={
            Student: inputUser,
        }
        SendData(Member);
    });
</script>
</html>
