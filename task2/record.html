<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin View | Student List</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #10b981;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 1000px;
        }

        h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- Table Styling --- */
        .table-wrapper {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead {
            background-color: rgba(15, 23, 42, 0.5);
        }

        th {
            padding: 16px 24px;
            color: var(--text-dim);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        td {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            font-size: 0.95rem;
            color: var(--text-main);
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        /* Status Badge for professional look */
        .status {
            color: var(--accent);
            font-size: 0.85rem;
            font-weight: 500;
        }
        .admin-container > h4{
            color: white;
            font-weight: bolder;
            font-size: 2rem;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>Registered Students</h2>
        <div class="table-wrapper">
        </div>
    </div>
</body>
<script>
   async function ReceiveData() {
    try {
        const Response = await fetch('http://localhost:3000/sendData');
        const Data = await Response.json(); // This is your array of students

        if (!Response.ok) throw new Error(`Error: ${Response.status}`);

        const Wrapper = document.querySelector('.table-wrapper');

        // 1. Handle Empty State
        if (Data.length === 0) {
            Wrapper.innerHTML = '<h4 style="text-align:center; padding:20px;">There is no User Registered</h4>';
        }

        Wrapper.innerHTML = `
            <table>
                <thead>
                    <tr>
                        <th>Roll Number</th>
                        <th>Student Name</th>
                        <th>Department</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
            </table>`;

        const tableBody = document.getElementById('adminTableBody');
        
        Data.forEach(item => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${item.RegNoVal}</td>
                <td>${item.NameVal}</td>
                <td>${item.DepartmentVal}</td>
                <td class="status">● Active</td>
            `;
            tableBody.appendChild(row);
        });

    } catch (err) {
        console.log('Something Went Wrong in record Page:', err);
    }
}
ReceiveData();
</script>
</html>
