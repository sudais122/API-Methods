<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Aura - Cart</title>
    <style>
        :root { --bg-deep: #0f172a; --bg-card: #1e293b; --text-main: #f1f5f9; --primary: #38bdf8; --accent: #4ade80; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-deep); color: var(--text-main); padding: 40px; margin: 0; }
        
        .cart-container { max-width: 800px; margin: auto; background: var(--bg-card); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .cart-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .cart-img { width: 100px; height: 100px; border-radius: 12px; object-fit: cover; margin-right: 20px; }
        
        .cart-details { flex-grow: 1; }
        .cart-details h4 { margin: 0; font-size: 1.2rem; }
        .cart-details p { color: #94a3b8; margin: 5px 0; }
        
        .cart-price { font-weight: bold; font-size: 1.2rem; color: var(--accent); }

        .summary { padding-top: 20px; text-align: right; }
        .total { font-size: 1.8rem; font-weight: bold; margin-bottom: 20px; color: var(--text-main); }
        
        .checkout-btn { background: var(--primary); color: var(--bg-deep); padding: 18px 50px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; font-size: 1.1rem; }
        
        .back-link { display: block; margin-top: 25px; color: var(--primary); text-decoration: none; font-weight: 500; }
    </style>
</head>
<body>
    <div class="cart-container">
        <h2>Your Encryption-Secured Cart</h2>
    </div>
    <script>
        const Container = document.querySelector('.cart-container');
        let url = 'http://localhost:3000/SendData';
        let totalPrice = 0;

        async function ReceiveData() {
            try{
                const Response = await fetch(url);
                const Data  = await Response.json();
                if(!Response.ok){throw new Error('Network response was not ok');}

                if(Data.length === 0){
                    Container.innerHTML = `<h3>Your cart is Empty</h3>`;
                    return;
                }
                console.log(Data);
    
    
                Data.forEach(item => {
                    const CartItem = document.createElement('div');
                    CartItem.classList.add('cart-item');
                    CartItem.innerHTML = `
                        <img src="${item.imgSrc}" class="cart-img" alt="Item">
                            <div class="cart-details">
                                <h4>${item.title}</h4>
                                <p>Qty: ${item.quantity}</p>
                            </div>
                        <div class="cart-price">$${item.price}</div>
                    `;
                    totalPrice += parseInt(item.price) * parseInt(item.quantity);
                    Container.appendChild(CartItem);
                });
    
    
                const Summary = document.createElement('div');
                Summary.classList.add('summary');
                
                Summary.innerHTML = `
                <div class="summary">
                    <div class="total">Total:$${totalPrice}</div>
                    <a href="#" class="checkout-btn">Complete Purchase</a>
                    <a href="index.html" class="back-link">← Continue Exploring</a>
                </div>`;
                Container.appendChild(Summary);
            }catch(error){
                Container.innerHTML = `<h3>Failed to load cart data. Please try again later.</h3>`;
                console.error('Error fetching data:', error);
            }
        }

        ReceiveData();
    </script>
</body>
</html>
