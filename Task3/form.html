<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dark Mode Form</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #121212;
            font-family: Arial, sans-serif;
            color: #ffffff;
        }

        .form-container {
            background-color: #1e1e1e;
            padding: 25px 30px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0,0,0,0.6);
        }

        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: none;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #ffffff;
            outline: none;
        }

        input::placeholder {
            color: #bbbbbb;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #00adb5;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background-color: #019ca3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Contact Form</h2>
        <form>
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="phone">Phone</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <button type="submit" id="button">Submit</button>
        </form>
    </div>
</body>

<script>
     async function SendData(User) {
        try{
            const Response = await fetch('http://localhost:3000/Senddata',{
                method: 'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body: JSON.stringify(User)
            })
            if(!Response.ok) throw new console.error(`Error:${Response.status}`);
            
            const Data = await Response.json();
            console.log(Data);
            window.location.href = 'record.html';
        }catch{
            console.log('Somethin Went Wrong');
        }
    }

    const BTN = document.getElementById('button');

   BTN.addEventListener('click', (e) => {
    e.stopPropagation();
    e.preventDefault();

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const phoneInput = document.getElementById('phone');

    let nameVal = nameInput.value.trim();
    let emailVal = emailInput.value.trim();
    let phoneVal = phoneInput.value.trim();

    if (nameVal == "" || emailVal == "" || phoneVal == "" || phoneVal != 11) {
        alert('Please Fill All fields');
    } else {
        const User = {
            name: nameVal,
            Email: emailVal,
            Phone: phoneVal,
        };

        SendData(User);

        nameInput.value = '';
        emailInput.value = '';
        phoneInput.value = '';
    }
});
</script>
</html>
