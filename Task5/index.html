<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Feedback Form</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .feedback-card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            margin-top: 0;
            color: #1c1e21;
            font-size: 1.5rem;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #4b4f56;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dddfe2;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box; /* Critical for layout alignment */
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, 
        textarea:focus {
            border-color: #1877f2;
        }

        textarea {
            resize: none; /* Prevents user from breaking the layout */
        }

        button {
            width: 100%;
            background-color: #1877f2;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #166fe5;
        }
    </style>
</head>
<body>
    <div class="feedback-card">
        <form>
            <h2>User Feedback</h2>

            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea rows="5" placeholder="Write your feedback here..." id="feedback" required></textarea>
            </div>

            <button id="submit">Submit Feedback</button>
        </form>
    </div>
</body>
<script>
    async function SendData(Feedback) {
        try{
            const Response = await fetch('http://localhost:3000/sendData',{
                method: 'POST',
                headers:{
                    'Content-Type':'application/json',
                },
                body: JSON.stringify(Feedback)
            });
            const Data = await Response.json()
            if(!Response.ok) throw new Error(`Error: ${Response.status}`);
            console.log(Data);
            window.location.href = 'feedback.html';
        }catch(err){
            console.log('Somtheing webt wrong at page login',err);
        }
    }
    const BTN = document.getElementById('submit');

    BTN.addEventListener('click',(e)=>{
        e.stopPropagation();
        e.preventDefault();
        const name = document.getElementById('name');
        const Feedback = document.getElementById('feedback');
        
        let nameinput = name.value.trim();
        let Mesage = Feedback.value.trim();
        if(nameinput === '' || Mesage === ''){
            alert('please input all fields')
        }else{
            const Details = {
                name: nameinput,
                Feedback: Mesage,
            }
            console.log(Details);
            SendData(Details);
            nameinput.value = '';
            Mesage.value = ''
        }
    });
</script>
</html>
